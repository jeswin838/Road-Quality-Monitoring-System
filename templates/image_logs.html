{% extends "base.html" %}
{% block title %}Image Logs — Pothole Monitor{% endblock %}
{% block page_title %}Image Logs{% endblock %}

{% block head %}
<style>
.img-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.img-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.img-tile:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.4); }
.img-tile img { width: 100%; height: 160px; object-fit: cover; display: block; }
.img-tile .img-no-image { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--muted); font-size: 2rem; }
.img-info { padding: 10px 12px; }
.img-info .img-title { font-size: .8rem; font-weight: 600; margin-bottom: 3px; }
.img-info .img-sub  { font-size: .72rem; color: var(--muted); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 12px; object-fit: contain; }
.lightbox-meta { color: #fff; margin-top: 12px; text-align: center; font-size: .85rem; }
.lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 2rem; cursor: pointer; background: none; border: none; }
.no-images { text-align: center; padding: 60px; color: var(--muted); }

@media (max-width: 768px) {
  .img-toolbar { flex-direction: column; align-items: stretch; }
  .img-toolbar .form-group { width: 100%; }
  .img-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .img-tile img, .img-tile .img-no-image { height: 120px; }
}
</style>
{% endblock %}

{% block content %}
<div class="img-toolbar glass-card" style="padding:14px;border-radius:14px;">
  <div class="form-group" style="margin:0;min-width:160px">
    <label>Type</label>
    <select id="imgType" class="form-input" onchange="loadImages()">
      <option value="">All Types</option>
      <option value="pothole">Pothole</option>
      <option value="crack">Crack</option>
    </select>
  </div>
  <div class="form-group" style="margin:0;min-width:160px">
    <label>Severity</label>
    <select id="imgSeverity" class="form-input" onchange="loadImages()">
      <option value="">All Severities</option>
      <option>High</option><option>Medium</option><option>Low</option>
    </select>
  </div>
  <div class="form-group" style="margin:0;min-width:160px">
    <label>Date From</label>
    <input type="date" id="imgDateFrom" class="form-input" onchange="loadImages()"/>
  </div>
  <div class="form-group" style="margin:0;flex:1">
    <label>Search Location</label>
    <input type="text" id="imgSearch" class="form-input" placeholder="Filter by lat/lon…" oninput="renderGrid()"/>
  </div>
  <div style="align-self:flex-end">
    <span id="imgCount" class="badge badge-neutral">—</span>
  </div>
</div>

<div class="img-grid" id="imgGrid">
  <div class="no-images" style="grid-column:1/-1"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
</div>

<div class="pagination" id="imgPagination" style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px;"></div>


<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div id="lbContent" style="max-width:90vw; max-height:80vh; display:flex; align-items:center; justify-content:center"></div>
  <div class="lightbox-meta" id="lbMeta"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let imgRecords = [];
let curPage = 1, pageSize = 20;

async function loadImages() {
  try {
    const type = document.getElementById('imgType').value;
    const severity = document.getElementById('imgSeverity').value;
    const date_from = document.getElementById('imgDateFrom').value;
    
    let url = `/api/potholes?dedupe=false&severity=${severity}&date_from=${date_from}&type=${type}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("API Error");
    imgRecords = await res.json();
  } catch (e) {
    console.error(e);
    imgRecords = [];
    document.getElementById('imgGrid').innerHTML = '<div class="no-images" style="grid-column:1/-1;color:var(--danger)">Failed to load data.</div>';
    return;
  }
  curPage = 1;
  renderGrid();
}

function renderGrid() {
  const search  = document.getElementById('imgSearch').value.toLowerCase();
  const filtered = imgRecords.filter(r => !search ||
    `${r.latitude} ${r.longitude} ${r.id}`.toLowerCase().includes(search));
  
  document.getElementById('imgCount').textContent = `${filtered.length} images`;

  const start = (curPage - 1) * pageSize;
  const records = filtered.slice(start, start + pageSize);

  const grid = document.getElementById('imgGrid');
  if (!records.length) {
    grid.innerHTML = '<div class="no-images" style="grid-column:1/-1"><i class="fa-solid fa-images fa-3x" style="margin-bottom:12px"></i><p>No images found</p></div>';
    document.getElementById('imgPagination').innerHTML = '';
    return;
  }
  grid.innerHTML = records.map(r => {
    const mediaUrl = r.image_url || r.media_url;
    const isVideo = r.type === 'video' || (mediaUrl && mediaUrl.endsWith('.mp4'));
    const source = r.source || (r.pothole ? 'AI' : 'Citizen');
    const severity = (r.severity || 'Medium').toLowerCase();
    
    return `
    <div class="img-tile" onclick="openLightbox('${mediaUrl}', ${r.id}, '${r.latitude}', '${r.longitude}', '${r.severity}', '${r.created_at}', '${isVideo ? 'video' : 'image'}')">
      ${isVideo 
        ? `<div class="img-no-image" style="background:#000"><i class="fa-solid fa-play-circle fa-2x"></i></div>`
        : (mediaUrl
            ? `<img src="${mediaUrl}" alt="Log #${r.id}" loading="lazy" onerror="this.onerror=null;this.outerHTML='<div class=\\'img-no-image\\' style=\\'color:#ef4444\\'><i class=\\'fa-solid fa-image-slash\\'></i></div>';"/>`
            : `<div class="img-no-image"><i class="fa-solid fa-image"></i></div>`)
      }
      <div class="img-info">
        <div class="img-title">#${r.id} ${source} — ${r.type || (isVideo ? 'video' : 'image')}</div>
        <div class="img-sub"><i class="fa-solid fa-map-pin"></i> ${(+r.latitude).toFixed(4)}, ${(+r.longitude).toFixed(4)}</div>
        <div class="img-sub"><i class="fa-regular fa-clock"></i> ${formatDt(r.created_at)}</div>
        <div style="margin-top:6px; display:flex; gap:4px">
           ${severityBadge(r.severity)}
           <span class="badge badge-neutral" style="font-size:0.6rem; opacity:0.8">${source.toUpperCase()}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  // Update Pagination
  const totalPages = Math.ceil(filtered.length / pageSize);
  let pagHtml = '';
  if (totalPages > 1) {
    for (let i = 1; i <= totalPages; i++) {
        if (i > 10 && i < totalPages - 2 && Math.abs(i - curPage) > 2) {
            if (i === 11) pagHtml += '<span style="color:var(--muted)">...</span>';
            continue;
        }
        pagHtml += `<button class="page-btn ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
  }
  document.getElementById('imgPagination').innerHTML = pagHtml;
}

function goPage(n) {
    curPage = n;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderGrid();
}

function openLightbox(src, id, lat, lon, severity, ts, type) {
  if (!src) return;
  const content = document.getElementById('lbContent');
  if (type === 'video') {
    content.innerHTML = `<video src="${src}" controls autoplay style="max-width:90vw; max-height:80vh; border-radius:12px"></video>`;
  } else {
    content.innerHTML = `<img src="${src}" alt="Report #${id}" style="max-width:90vw; max-height:80vh; border-radius:12px; object-fit:contain"/>`;
  }
  document.getElementById('lbMeta').innerHTML =
    `<strong>#${id}</strong> | 📍 ${(+lat).toFixed(5)}, ${(+lon).toFixed(5)} | ${formatDt(ts)} | ${severityBadge(severity)}`;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox(e) {
  if (!e || (e.target !== document.querySelector('#lbContent img') && e.target !== document.querySelector('#lbContent video'))) {
    document.getElementById('lbContent').innerHTML = ''; // Stop video
    document.getElementById('lightbox').classList.remove('active');
  }
}

function formatDt(s) { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString(); }
function severityBadge(s) {
  const sev = (s || '').toLowerCase();
  const cls = sev==='high'?'badge-danger':sev==='medium'?'badge-warning':'badge-success';
  return `<span class="badge ${cls}" style="font-size:.65rem">${s||'—'}</span>`;
}

loadImages();
</script>
{% endblock %}
